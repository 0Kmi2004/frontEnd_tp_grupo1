<div class="explorer-container">

  <!-- Header -->
  <header class="topbar">

    <button class="icon-btn">
      ☰
    </button>

    <h1>Explorar</h1>

    <button class="icon-btn">
      🔔
    </button>

  </header>

  <!-- Search -->

  <div class="search-container" routerLink="/search">

    <input
      type="text"
      placeholder="Buscar libros, autores, géneros..."
    />

  </div>

  <!-- Recomendados -->

  <section class="section">

    <div class="section-header">
      <h2>Recomendados para ti</h2>
      <a href="#">Ver más</a>
    </div>

    <div class="books-scroll">

      <div 
      class="book"
      *ngFor="let book of recommendedBooks"
      [routerLink]="['/book', book.key.replace('/works/', '')]">
        <img [src]="'https://covers.openlibrary.org/b/id/' + book.cover_i + '-M.jpg'"
        [alt]="book.title">
        <p class="book-title">
          {{ book.title }}
        </p>
      </div>

    </div>

  </section>

  <!-- Categorias -->

  <section class="section">

    <div class="section-header">
      <h2>Categorías</h2>
      <a href="#">Ver más</a>
    </div>

    <div class="categories">

      <button>Ficción</button>
      <button>Historia</button>
      <button>Ciencia</button>
      <button>Autoayuda</button>
      <button>Romance</button>
      <button>Misterio</button>

    </div>

  </section>

  <!-- Novedades -->

  <section class="section">

    <div class="section-header">
      <h2>Novedades</h2>
      <a href="#">Ver más</a>
    </div>

    <div class="books-scroll">

      <div 
      class="book"
      *ngFor="let book of newBooks"
      [routerLink]="['/book', book.key.replace('/works/', '')]">
        <img [src]="'https://covers.openlibrary.org/b/id/' + book.cover_i + '-M.jpg'"
        [alt]="book.title">
        <p class="book-title">
          {{ book.title }}
        </p>
      </div>

    </div>

  </section>

  <!-- Bottom Nav -->

  <nav class="bottom-nav">

    <button class="active">
      🏠
      <span>Inicio</span>
    </button>

    <button routerLink="/library">
      📚
      <span>Biblioteca</span>
    </button>

    <button routerLink="/favorites">
      ❤️
      <span>Favoritos</span>
    </button>

    <button routerLink="/profile">
      👤
      <span>Perfil</span>
    </button>

  </nav>

</div>
