<div class="search-page">

  <div class="search-header">
    <button class="back-btn" routerLink="/home">
      <img src="/arrow.png" alt="Volver" width="15px">
    </button>

    <input
      #searchInput
      type="text"
      placeholder="Buscar libros"
      (keyup.enter)="buscar(searchInput.value)"
    />
    
    <button class="back-btn" (click)="buscar(searchInput.value)">
      <img src="/lupa.png" alt="Buscar" width="20px">
    </button>
  </div>

  <div class="tabs">
    <button [class.active]="selectedTab === 'all'" (click)="setTab('all')">Todos</button>
    <button [class.active]="selectedTab === 'books'" (click)="setTab('books')">Libros</button>
    <button [class.active]="selectedTab === 'authors'" (click)="setTab('authors')">Autores</button>
    <button [class.active]="selectedTab === 'genres'" (click)="setTab('genres')">Géneros</button>
  </div>

  <div class="results">
    <div *ngIf="books.length === 0" style="text-align: center; margin-top: 2rem; color: #666;">
      <p>Buscá un título, autor o género para empezar.</p>
    </div>

    <div class="result-item" *ngFor="let book of books">
      <img
        [src]="book.cover_i ? 'https://covers.openlibrary.org/b/id/' + book.cover_i + '-M.jpg' : 'https://via.placeholder.com/120x180?text=Sin+Portada'"
        [alt]="book.title"
        class="book-cover"
        [routerLink]="['/book', book.key.replace('/works/', '')]"
        style="cursor: pointer;"
      >

      <div class="book-info">
        <h3>{{ book.title }}</h3>
        <p>{{ book.author_name?.[0] || 'Desconocido' }}</p>
        <span class="rating">
          {{ getRating(book) }}
        </span>

        <div class="action-buttons" style="margin-top: 10px; display: flex; gap: 10px;">
          <button (click)="agregarAFavoritos(book)" style="padding: 5px 10px; cursor: pointer; background: transparent; border: 1px solid #ccc; border-radius: 4px;">
            ❤️
          </button>
          <button (click)="agregarABiblioteca(book)" style="padding: 5px 10px; cursor: pointer; background: transparent; border: 1px solid #ccc; border-radius: 4px;">
            ➕ Biblioteca
          </button>
        </div>
      </div>

      <button class="menu-btn" [routerLink]="['/book', book.key.replace('/works/', '')]">
        ⋮
      </button>
    </div>
  </div>

</div>
