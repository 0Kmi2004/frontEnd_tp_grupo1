<div class="login-container">

  <div class="login-card">

    <h1>Iniciar sesión</h1>

    <p class="subtitle">
      Accede a tu cuenta para continuar
    </p>

    <div class="social-buttons">

      <button class="social-btn">
        <div class="interior-boton">
          <div class="img-container">
            <img
            src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
            alt="Google" width="20px" height="20px">
          </div>
          <div class="p-container">
            <p>Continuar con Google</p>
          </div>
        </div>
      </button>

      <button class="social-btn">
        <div class="interior-boton">
          <div class="img-container">
            <img
            src="https://cdn-icons-png.flaticon.com/512/124/124010.png"
            alt="Facebook" width="20px" height="20px">
          </div>
          <div class="p-container">
            <p>Continuar con Facebook</p>
          </div>
        </div>
      </button>

      <button class="social-btn">
        <div class="interior-boton">
          <div class="img-container">
            <img src="/apple-logo.png" alt="" width="20px">
          </div>
          <div class="p-container">
            <p>Continuar con Apple</p>
          </div>
        </div>
      </button>

    </div>

    <div class="divider">
      <span>o</span>
    </div>

    <form>

      <div class="form-group">
        <label>Correo electrónico</label>
        <input
          type="email"
          placeholder="ejemplo@correo.com">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input
          type="password"
          placeholder="********">
      </div>

      <a href="#" class="forgot-password">
        ¿Olvidaste tu contraseña?
      </a>

      <button class="login-btn">
        Iniciar sesión
      </button>

    </form>

    <p class="register-text">
      ¿No tienes cuenta?
      <a routerLink="/register">Regístrate</a>
    </p>

  </div>

</div>
