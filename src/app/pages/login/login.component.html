<div class="login-container">
  <div class="login-card">
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Accede a tu cuenta para continuar</p>

    <form #loginForm="ngForm" (ngSubmit)="iniciarSesion()">

      <div class="form-group">
        <label>Correo electrónico</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          #emailInput="ngModel"
          placeholder="ejemplo@correo.com"
          required
          email>
          
        <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="error-text">
          <small *ngIf="emailInput.errors?.['required']">El correo es obligatorio.</small>
          <small *ngIf="emailInput.errors?.['email']">Debe ser un formato válido (ej: nombre&#64;correo.com).</small>
        </div>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          #passwordInput="ngModel"
          placeholder="********"
          required
          minlength="5">
          
        <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="error-text">
          <small *ngIf="passwordInput.errors?.['required']">La contraseña es obligatoria.</small>
          <small *ngIf="passwordInput.errors?.['minlength']">Debe tener al menos 5 caracteres.</small>
        </div>
      </div>

      <button type="submit" class="login-btn" [disabled]="loginForm.invalid" [class.disabled]="loginForm.invalid">
        Iniciar sesión
      </button>

    </form>
  </div>
</div>
