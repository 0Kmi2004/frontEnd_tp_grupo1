<div class="library-container">

  <header class="topbar">
    <h1>Libros leidos</h1>
  </header>

  <div class="books-list">
    <div
      class="book-item"
      *ngFor="let book of libraryBooks; let i = index">

      <img
        [src]="getCover(book)"
        [alt]="book.title">

      <div class="book-info">
        <h3>{{ book.title }}</h3>
        <p>
          {{ book.authorName || 'Autor desconocido' }}
        </p>
      </div>
      
      <button class="menu-btn" (click)="removeBook(i)">✕</button>
    </div>
  </div>

  <div
    class="empty-state"
    *ngIf="libraryBooks.length === 0">
    <h3>No tienes libros</h3>
    <p>Agrega libros a biblioteca para verlos aquí.</p>
  </div>

  <nav class="bottom-nav">
    <button routerLink="/home">
      🏠
      <span>Inicio</span>
    </button>
    <button class="active-nav">
      📚
      <span>Libros leidos</span>
    </button>
    <button routerLink="/profile">
      👤
      <span>Perfil</span>
    </button>
  </nav>

</div>
