<div class="library-container">

  <header class="topbar">

    <button class="icon-btn" (click)="loadBooks()">
      ↻
    </button>

    <h1>Mi biblioteca</h1>

    <div class="placeholder"></div>

  </header>

  <!-- Tabs -->

  <div class="tabs">

    <button
      [class.active]="activeTab === 'Todos'"
      (click)="setTab('Todos')">
      Todos
    </button>

    <button
      [class.active]="activeTab === 'Leyendo'"
      (click)="setTab('Leyendo')">
      Leyendo
    </button>

    <button
      [class.active]="activeTab === 'Completados'"
      (click)="setTab('Completados')">
      Completados
    </button>

    <button
      [class.active]="activeTab === 'Pendientes'"
      (click)="setTab('Pendientes')">
      Pendientes
    </button>

  </div>

  <!-- Libros -->

  <div class="books-list">

    <div
      class="book-item"
      *ngFor="let book of filteredBooks">

      <img
        [src]="getCover(book)"
        [alt]="book.title">

      <div class="book-info">

        <h3>{{ book.title }}</h3>

        <p>
          {{ book.author_name?.[0] || 'Autor desconocido' }}
        </p>

        <span class="status-badge">
          {{ book.status }}
        </span>

        <span class="progress-text">
          {{ book.progress }}%
        </span>

        <div class="progress-bar">

          <div
            class="progress"
            [style.width.%]="book.progress">
          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- Bottom Nav -->

  <nav class="bottom-nav">

    <button routerLink="/home">
      🏠
      <span>Inicio</span>
    </button>

    <button class="active-nav">
      📚
      <span>Biblioteca</span>
    </button>

    <button routerLink="/favorites">
      ❤️
      <span>Favoritos</span>
    </button>

    <button routerLink="/profile">
      👤
      <span>Perfil</span>
    </button>

  </nav>

</div>
