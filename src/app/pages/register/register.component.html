<div class="login-container">

  <div class="login-card">

    <h1>Crear cuenta</h1>

    <p class="subtitle">
      Regístrate para comenzar tu experiencia de lectura
    </p>

    <div class="social-buttons">

      <button class="social-btn">
        <div class="interior-boton">
          <div class="img-container">
            <img
            src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
            alt="Google" width="20px" height="20px">
          </div>
          <div class="p-container">
            <p>Registrarse con Google</p>
          </div>
        </div>
      </button>

      <button class="social-btn">
        <div class="interior-boton">
          <div class="img-container">
            <img
            src="https://cdn-icons-png.flaticon.com/512/124/124010.png"
            alt="Facebook" width="20px" height="20px">
          </div>
          <div class="p-container">
            <p>Registrarse con Facebook</p>
          </div>
        </div>
      </button>

      <button class="social-btn">
        <div class="interior-boton">
          <div class="img-container">
            <img src="/apple-logo.png" alt="" width="20px">
          </div>
          <div class="p-container">
            <p>Registrarse con Apple</p>
          </div>
        </div>
      </button>

    </div>

    <div class="divider">
      <span>o</span>
    </div>

<form>

      <div class="form-group">
        <label>Nombre completo</label>
        <input
          type="text"
          placeholder="Juan Pérez">
      </div>

      <div class="form-group">
        <label>Correo electrónico</label>
        <input
          type="email"
          placeholder="ejemplo@correo.com">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input
          type="password"
          placeholder="********">
      </div>

      <div class="form-group">
        <label>Confirmar contraseña</label>
        <input
          type="password"
          placeholder="********">
      </div>

      <div class="terms">
        <input type="checkbox" id="terms">
        <label for="terms">
          Acepto los términos y condiciones
        </label>
      </div>

      <button class="register-btn">
        Crear cuenta
      </button>

    </form>

    <p class="login-text">
      ¿Ya tienes una cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>

  </div>

</div>
